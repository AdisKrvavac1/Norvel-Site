services:
  - type: web
    name: norvel-site
    runtime: static
    buildCommand: python3 build/build.py
    staticPublishPath: ./public
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /projects
        destination: /projects/index.html
